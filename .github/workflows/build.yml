name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Source branch, tag, or commit
        required: true
        default: main
        type: string
      mode:
        description: Build mode
        required: true
        default: release
        type: choice
        options:
          - debug
          - release

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  desktop:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows-x86_64
            runner: windows-latest
            binary: courtday.exe

    steps:
      - name: Checkout private source
        uses: actions/checkout@v7
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: ${{ inputs.ref }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          path: source

      - name: Prepare private release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN || secrets.PRIVATE_SOURCE_TOKEN }}
          ARTIFACT_REPO: ${{ secrets.PRIVATE_ARTIFACT_REPO || secrets.PRIVATE_SOURCE_REPO }}
          SOURCE_REPO: ${{ secrets.PRIVATE_SOURCE_REPO }}
          MODE: ${{ inputs.mode }}
          PLATFORM: ${{ matrix.platform.name }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$ARTIFACT_REPO" --jq '.private')" != "true" ]; then
            echo "::error::Build output requires a private repository"
            exit 1
          fi

          sha=$(git -C source rev-parse HEAD)
          tag="ci-${sha:0:12}-${MODE}-${PLATFORM}"
          target=()
          if [ "$ARTIFACT_REPO" = "$SOURCE_REPO" ]; then
            target=(--target "$sha")
          fi

          if ! gh release view "$tag" --repo "$ARTIFACT_REPO" > /dev/null 2>&1; then
            gh release create "$tag" --repo "$ARTIFACT_REPO" \
              "${target[@]}" --title "$tag" --notes "Source commit: $sha" \
              --draft --prerelease --latest=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential clang cmake ninja-build pkg-config \
            libfontconfig1-dev libfreetype6-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libxcb-xkb-dev libxcb-cursor-dev libxcb-randr0-dev \
            libxcb-xfixes0-dev libxcb-shape0-dev libxcb-render0-dev libxcb-sync-dev \
            libxcb-present-dev libxcb-dri3-dev libasound2-dev libssl-dev libvulkan-dev \
            mesa-vulkan-drivers libclang-dev libcups2-dev fonts-inter

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        working-directory: source
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "release" ]; then
            cargo build --locked --release --workspace
          else
            cargo build --locked --workspace
          fi

      - name: Test binary
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          BINARY: ${{ matrix.platform.binary }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cp "source/target/$MODE/$BINARY" "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke"
          "./$BINARY" --help

      - name: Prepare binary
        id: package
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          BINARY: ${{ matrix.platform.binary }}
          PLATFORM: ${{ matrix.platform.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          extension=""
          if [ "$RUNNER_OS" = "Windows" ]; then
            extension=".exe"
          fi
          filename="courtday-${PLATFORM}-${MODE}${extension}"
          cp "source/target/$MODE/$BINARY" \
            "$RUNNER_TEMP/release/$filename"
          sha=$(git -C source rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"

      - name: Upload private release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_RELEASE_TOKEN || secrets.PRIVATE_SOURCE_TOKEN }}
          ARTIFACT_REPO: ${{ secrets.PRIVATE_ARTIFACT_REPO || secrets.PRIVATE_SOURCE_REPO }}
          TAG: ${{ steps.release.outputs.tag }}
          FILENAME: ${{ steps.package.outputs.filename }}
        run: |
          set -euo pipefail
          asset="$RUNNER_TEMP/release/$FILENAME"

          gh release upload "$TAG" "$asset" --repo "$ARTIFACT_REPO" --clobber
          gh release edit "$TAG" --repo "$ARTIFACT_REPO" --draft=false --latest=false
